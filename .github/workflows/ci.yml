name: CI

on:
  push:        # every branch — feature branches show results without needing a PR
  pull_request:

# Cancel in-progress runs for the same branch when a new commit arrives.
# Always finish whatever's running on `main` though — useful as a release-readiness signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src

  test:
    name: Unit tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux; latest stable only on Windows.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The E2E suite needs Linux render libs and is covered by the dedicated
      # `e2e` job below — skip it in the cross-Python matrix to keep this job
      # focused on what the unit tests verify.
      - run: pytest --ignore=tests/test_e2e.py

  e2e:
    name: E2E (real groupdocs.viewer rendering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux render libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgdiplus \
              libc6-dev \
              libfontconfig1 \
              fontconfig \
              fonts-dejavu \
              fonts-liberation
          # Ubuntu installs libgdiplus as `libgdiplus.so.0` only — .NET's
          # System.Drawing.Common dlopen()s `libgdiplus` (no version suffix)
          # and fails with "Type initializer for 'Gdip' threw an exception"
          # without this alias. Idempotent: the package may install the
          # symlink directly on some releases.
          if [ ! -e /usr/lib/x86_64-linux-gnu/libgdiplus.so ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libgdiplus.so.0 \
                       /usr/lib/x86_64-linux-gnu/libgdiplus.so
          fi

      - name: Verify libgdiplus install (diagnostic)
        run: |
          ls -la /usr/lib/x86_64-linux-gnu/libgdiplus* || true
          ldconfig -p | grep -i gdiplus || echo "no gdiplus in ld cache"

      - run: pip install -e ".[dev]"

      # Real groupdocs.viewer renders a real DOCX through the full HTTP stack —
      # verbose so failures pinpoint which endpoint regressed.
      #
      # DOTNET_SYSTEM_DRAWING_ENABLE_UNIX_SUPPORT is REQUIRED on .NET 6+:
      # System.Drawing.Common is Windows-only by default and refuses to load
      # libgdiplus on Linux without this opt-in switch. Without it the install
      # above is moot — Gdip's type initializer throws regardless of whether
      # libgdiplus is dlopen-able. See https://aka.ms/systemdrawingnonwindows
      - run: pytest tests/test_e2e.py -v
        env:
          DOTNET_SYSTEM_DRAWING_ENABLE_UNIX_SUPPORT: "true"
