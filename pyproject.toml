[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groupdocs-viewer-net-ui"
version = "26.4.0"
description = "Web UI for groupdocs-viewer-net — mount into FastAPI/Flask/Django, or run standalone."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "GroupDocs", email = "developers@groupdocs.com" }]
keywords = ["groupdocs", "viewer", "document", "ui", "web", "fastapi", "starlette"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business",
]
dependencies = [
  "groupdocs-viewer-net>=25.12",
  "starlette>=0.37",
  "pydantic>=2.0",
  "typer>=0.12",
  "uvicorn>=0.29",
  "asgiref>=3.7",
  # Required for the /upload-file endpoint — Starlette's request.form()
  # raises at runtime without it. Not a dev-only dep.
  "python-multipart>=0.0.9",
  # Required for /upload-file's URL-fetch mode and used by the test client.
  "httpx>=0.27",
]

[project.optional-dependencies]
s3    = ["aioboto3>=12"]
azure = ["azure-storage-blob>=12.25", "aiohttp>=3.9"]
redis = ["redis>=5.0"]
all   = ["groupdocs-viewer-net-ui[s3,azure,redis]"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "fakeredis>=2.20",
]

[project.scripts]
groupdocs-viewer-ui = "groupdocs_viewer_ui.cli:main"

[project.urls]
Homepage = "https://products.groupdocs.com/viewer/python-net"
Repository = "https://github.com/groupdocs-viewer/GroupDocs.Viewer-for-Python-via-.NET-UI"
"Bug Tracker" = "https://github.com/groupdocs-viewer/GroupDocs.Viewer-for-Python-via-.NET-UI/issues"
Documentation = "https://docs.groupdocs.com/viewer/python-net/"

[tool.hatch.build.targets.wheel]
packages = ["src/groupdocs_viewer_ui"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's CLI pattern requires `typer.Option(...)` and `Path.cwd()` as
# argument defaults — that's the canonical usage from the Typer docs.
# B008 ("function call in default") is incompatible with the framework
# here, not a real bug.
"src/groupdocs_viewer_ui/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
